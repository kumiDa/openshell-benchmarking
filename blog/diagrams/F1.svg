<svg viewBox="0 0 960 460" role="img" aria-label="How one agent command runs in OpenShell: the agent on the host sends it through the gateway into the sandbox, where Landlock and seccomp constrain the process; every outbound connection passes the supervisor proxy, which allows pypi.org and swaps in the real token, and refuses example.com with a logged denial." xmlns="http://www.w3.org/2000/svg" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="f1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/>
    </marker>
  </defs>

  <!-- region labels -->
  <text x="30" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="currentColor" opacity="0.7">HOST</text>
  <text x="790" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="currentColor" opacity="0.7">INTERNET</text>

  <!-- agent -->
  <rect x="30" y="70" width="180" height="60" rx="4" style="fill:var(--panel)" stroke="currentColor" stroke-width="1.2"/>
  <text x="120" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Agent loop</text>
  <text x="120" y="116" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">runs on the host</text>

  <!-- model -->
  <rect x="30" y="260" width="180" height="60" rx="4" style="fill:var(--panel)" stroke="currentColor" stroke-width="1.2"/>
  <text x="120" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Model server</text>
  <text x="120" y="306" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">Ollama · qwen2.5:3b</text>
  <line x1="120" y1="132" x2="120" y2="256" stroke="currentColor" stroke-width="1.4" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
  <text x="130" y="190" font-size="11.5" fill="currentColor">chat</text>
  <text x="130" y="206" font-size="11.5" fill="currentColor" opacity="0.75">~4 s per step</text>

  <!-- gateway -->
  <rect x="270" y="70" width="170" height="60" rx="4" style="fill:var(--panel)" stroke="currentColor" stroke-width="1.2"/>
  <text x="355" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Gateway</text>
  <text x="355" y="116" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">mTLS · 127.0.0.1:17670</text>
  <line x1="212" y1="100" x2="266" y2="100" stroke="currentColor" stroke-width="1.4" marker-end="url(#f1a)"/>
  <text x="239" y="90" text-anchor="middle" font-size="11" fill="currentColor">exec</text>
  <text x="239" y="120" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">+10 ms</text>

  <!-- sandbox boundary -->
  <rect x="490" y="30" width="250" height="300" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="505" y="52" font-size="12" font-weight="700" letter-spacing="1.5" fill="currentColor" opacity="0.7">SANDBOX</text>
  <line x1="442" y1="100" x2="506" y2="100" stroke="currentColor" stroke-width="1.4" marker-end="url(#f1a)"/>
  <text x="474" y="90" text-anchor="middle" font-size="11" fill="currentColor">relay</text>

  <rect x="510" y="70" width="210" height="60" rx="4" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.2"/>
  <text x="615" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">bash · git · python3</text>
  <text x="615" y="116" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">the agent's commands</text>

  <text x="510" y="160" font-size="11.5" fill="currentColor"><tspan font-weight="700">Landlock</tspan>  write: workspace, /tmp</text>
  <text x="510" y="180" font-size="11.5" fill="currentColor"><tspan font-weight="700">seccomp</tspan>  e.g. no nice()</text>

  <rect x="510" y="200" width="210" height="58" rx="4" style="fill:var(--bg)" stroke="currentColor" stroke-width="1.2"/>
  <text x="522" y="223" font-size="11.5" fill="currentColor">env  API_TOKEN =</text>
  <text x="522" y="243" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor">openshell:resolve:…</text>

  <!-- every connection to the proxy -->
  <line x1="615" y1="260" x2="615" y2="362" stroke="currentColor" stroke-width="1.4" marker-end="url(#f1a)"/>
  <text x="607" y="296" font-size="11" fill="currentColor" text-anchor="end">every connection</text>
  <text x="607" y="312" font-size="11" fill="currentColor" opacity="0.75" text-anchor="end">DNS + TCP</text>

  <!-- supervisor proxy: the decision point -->
  <rect x="490" y="366" width="250" height="70" rx="4" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="2"/>
  <text x="615" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Supervisor proxy</text>
  <text x="615" y="408" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.8">checks host · port · binary</text>
  <text x="615" y="424" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.8">and HTTP method + path</text>

  <!-- upstreams -->
  <rect x="790" y="250" width="150" height="56" rx="4" style="fill:var(--panel)" stroke="currentColor" stroke-width="1.2"/>
  <text x="865" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">pypi.org</text>
  <text x="865" y="293" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">in the policy</text>
  <rect x="790" y="380" width="150" height="56" rx="4" style="fill:var(--panel)" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="865" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">example.com</text>
  <text x="865" y="423" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.75">not in the policy</text>

  <path d="M742 384 L768 384 L768 278 L786 278" fill="none" style="stroke:var(--accent)" stroke-width="2" marker-end="url(#f1b)"/>
  <text x="940" y="236" font-size="11" fill="currentColor" text-anchor="end">allowed · real token swapped in</text>

  <line x1="742" y1="418" x2="776" y2="418" stroke="currentColor" stroke-width="1.4"/>
  <line x1="770" y1="410" x2="784" y2="426" stroke="currentColor" stroke-width="2"/>
  <line x1="784" y1="410" x2="770" y2="426" stroke="currentColor" stroke-width="2"/>
  <text x="742" y="452" font-size="11" fill="currentColor">refused · logged as OCSF denial</text>
</svg>

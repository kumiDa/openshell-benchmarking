version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  pypi_l4:
    name: pypi_l4
    endpoints:
      - { host: pypi.org, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
  host_bridge:
    name: host_bridge
    endpoints:
      - { port: 18080, allowed_ips: ["172.17.0.1/32"] }
      - { port: 11434, allowed_ips: ["172.17.0.1/32"] }
    binaries:
      - { path: /usr/bin/curl }
